<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bolzoon Invite</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffe6f2,#f5f8ff);
  overflow:hidden;
}

/* CARD */

.card{
  width:360px;
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  position:relative;
}

/* IMAGE */

.profile{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #ff4f95;
  margin-bottom:15px;
}

/* TEXT */

h2{
  color:#d63384;
  margin-bottom:12px;
}

p{
  color:#666;
  margin-bottom:20px;
  line-height:1.5;
}

/* BUTTONS */

button{
  border:none;
  padding:14px 26px;
  border-radius:999px;
  font-size:18px;
  cursor:pointer;
  transition:0.2s;
}

#yes{
  background:#ff3d8d;
  color:white;
  box-shadow:0 5px 15px rgba(255,61,141,0.4);
}

#yes:hover{
  transform:scale(1.05);
}

.btns{
  position:relative;
  height:90px;
}

#no{
  position:absolute;
  background:#eee;
  color:#444;
  left:200px;
  top:0;
}

/* PAGE 2 */

.page2{
  display:none;
}

input, select{
  width:100%;
  padding:14px;
  border-radius:15px;
  border:2px solid #ffd1e6;
  margin-bottom:15px;
  font-size:16px;
}

/* RESULT */

.result{
  display:none;
}

.dateBox{
  margin-top:20px;
  background:#fff0f7;
  border-radius:18px;
  padding:18px;
  color:#d63384;
  font-weight:bold;
  line-height:1.8;
}

/* HEARTS */

.hearts{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  overflow:hidden;
  pointer-events:none;
}

.heart{
  position:absolute;
  font-size:22px;
  animation:float 4s linear infinite;
}

@keyframes float{

  from{
    transform:translateY(100vh);
    opacity:1;
  }

  to{
    transform:translateY(-120px);
    opacity:0;
  }

}

</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<!-- PAGE 1 -->

<div class="card" id="page1">

<img class="profile"
src="zrg.png">

<h2>Надтай болзоонд явах уу? 💖</h2>

<p>
Чамтай хамт гоё өдөр өнгөрүүлмээр байна 🥺
</p>

<div class="btns">

<button id="yes">
ТИЙМ 💕
</button>

</div>

</div>


<!-- PAGE 2 -->

<div class="card page2" id="page2">

<img class="profile"
src="https://i.pinimg.com/736x/28/2e/f8/282ef8973cb0f04d01fbb7a4484a1c84.jpg">

<h2>Тэр өдрөө сонгоорой 📅</h2>

<p>
Бидний болзооны өдөр болон цагаа сонго 💞
</p>

<input type="date" id="date">

<select id="time">

<option value="">
Цагаа сонго
</option>

<option>11:00</option>
<option>12:00</option>
<option>13:00</option>
<option>14:00</option>
<option>15:00</option>
<option>16:00</option>
<option>17:00</option>
<option>18:00</option>

</select>

<button id="continueBtn">
ҮРГЭЛЖЛҮҮЛЭХ 💖
</button>

</div>


<!-- PAGE 3 -->

<div class="card result" id="resultPage">

<img class="profile"
src="https://i.pinimg.com/736x/61/53/e0/6153e0c7d2f8a1f25a94e7b89f82f4d4.jpg">

<h2>Зөвшөөрсөнд баярлалаа 🎉</h2>

<p>
Хүлээж ядаж байна 😍
</p>

<div class="dateBox" id="finalText"></div>

</div>

<script>

/* ELEMENTS */

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const resultPage = document.getElementById("resultPage");

const continueBtn = document.getElementById("continueBtn");

const finalText = document.getElementById("finalText");

/* YES CLICK */

yesBtn.addEventListener("click",()=>{

  page1.style.display = "none";
  page2.style.display = "block";

});


/* CONTINUE */

continueBtn.addEventListener("click",()=>{

  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  if(date === "" || time === ""){
    alert("Өдөр болон цагаа сонгоно уу 💖");
    return;
  }

  page2.style.display = "none";
  resultPage.style.display = "block";

  finalText.innerHTML = `
    📅 ${date} <br>
    🕒 ${time} цагт уулзана 💕 <br><br>
    Чамайгаа хүлээж байх болно 😘
  `;

});


/* HEART ANIMATION */

function createHeart(){

  const heart = document.createElement("div");

  heart.classList.add("heart");

  heart.innerHTML = "💖";

  heart.style.left =
  Math.random() * 100 + "vw";

  heart.style.animationDuration =
  (Math.random() * 2 + 3) + "s";

  document.getElementById("hearts")
  .appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },5000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
